<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de Órdenes de Compra</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#6b7686; --brand:#1f6f5c; --warn:#b45309; --warnbg:#fff7ed; --line:#e3e7ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:860px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; margin:10px 0; max-width:85%; white-space:pre-wrap; line-height:1.45; }
  .user { background:var(--brand); color:#fff; margin-left:auto; }
  .bot { background:var(--card); border:1px solid var(--line); }
  details.tool { margin:8px 0; background:var(--card); border:1px solid var(--line); border-left:4px solid #64748b; border-radius:8px; padding:6px 10px; font-size:13px; }
  details.tool.err { border-left-color:#b91c1c; }
  details.tool summary { cursor:pointer; font-weight:600; }
  details.tool pre { margin:6px 0 0; overflow-x:auto; background:#f1f5f9; padding:8px; border-radius:6px; font-size:12px; }
  .confirm { background:var(--warnbg); border:2px solid var(--warn); border-radius:12px; padding:14px; margin:12px 0; }
  .confirm h3 { margin:0 0 6px; color:var(--warn); font-size:15px; }
  .confirm button { margin-right:8px; }
  form { display:flex; gap:8px; padding:14px 20px; background:var(--card); border-top:1px solid var(--line); max-width:none; }
  form input { flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
  button.secondary { background:#9a3412; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin:20px 0; }
</style>
</head>
<body>
<header><h1>Agente de Órdenes de Compra</h1><small>Controles + SAP simulado</small></header>
<div id="log"><p class="hint">Ejemplo: «Procesa la solicitud sol-001».</p></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Escribe tu mensaje…" maxlength="4000">
  <button id="send">Enviar</button>
</form>
<script>
  const sessionId = crypto.randomUUID();
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function scroll() { log.scrollTop = log.scrollHeight; }

  function renderEvents(events) {
    const calls = {};
    for (const ev of events) {
      if (ev.type === 'tool_call') {
        const d = el('details', 'tool');
        d.appendChild(el('summary', null, '🔧 ' + ev.name));
        d.appendChild(el('pre', null, JSON.stringify(ev.input, null, 2)));
        log.appendChild(d); calls[ev.id] = d;
      } else if (ev.type === 'tool_result') {
        const d = calls[ev.id];
        if (d) { if (!ev.result.ok) d.classList.add('err'); d.appendChild(el('pre', null, JSON.stringify(ev.result, null, 2))); }
      }
    }
  }

  function renderConfirm(p) {
    const box = el('div', 'confirm');
    box.appendChild(el('h3', null, '⚠ Se requiere confirmación humana — ' + p.caso_id));
    box.appendChild(el('div', null, p.motivo));
    const row = el('div'); row.style.marginTop = '10px';
    const ok = el('button', null, 'Aprobar');
    const no = el('button', 'secondary', 'Rechazar');
    ok.onclick = () => decide(true, box); no.onclick = () => decide(false, box);
    row.append(ok, no); box.appendChild(row); log.appendChild(box);
  }

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
    return data;
  }

  function handle(data) {
    renderEvents(data.events || []);
    if (data.reply) log.appendChild(el('div', 'msg bot', data.reply));
    if (data.pending) renderConfirm(data.pending);
    scroll();
  }

  async function decide(approve, box) {
    box.querySelectorAll('button').forEach(b => b.disabled = true);
    box.appendChild(el('div', null, approve ? '✔ Aprobado por el humano' : '✖ Rechazado por el humano'));
    try { handle(await post('/api/confirm', { sessionId, approve })); }
    catch (e) { log.appendChild(el('div', 'msg bot', 'Error: ' + e.message)); }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    input.value = ''; send.disabled = true;
    log.appendChild(el('div', 'msg user', text)); scroll();
    try { handle(await post('/api/chat', { sessionId, message: text })); }
    catch (err) { log.appendChild(el('div', 'msg bot', 'Error: ' + err.message)); }
    send.disabled = false; input.focus(); scroll();
  });
</script>
</body>
</html>
