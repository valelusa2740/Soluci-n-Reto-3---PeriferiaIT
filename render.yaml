services:
  - type: web
    name: reto-03-oc-agent
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run typecheck && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_PETICIONES_MINUTO
        value: "10"
      - key: ACCESS_USER
        sync: false
      - key: ACCESS_PASS
        sync: false
      - key: MAX_TOKENS_SESION
        value: "150000"
      - key: MAX_TOKENS_DIA
        value: "2000000"
