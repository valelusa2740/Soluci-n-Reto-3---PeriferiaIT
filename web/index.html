<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de Órdenes de Compra</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2430; --muted:#667085; --brand:#1f6f5c; --warn:#b45309; --warnbg:#fff7ed; --err:#b91c1c; --line:#e4e7ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--muted); }
  header button { background:#475467; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .wrap { max-width:900px; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; margin:10px 0; max-width:88%; line-height:1.45; overflow-x:auto; }
  .user { background:var(--brand); color:#fff; margin-left:auto; white-space:pre-wrap; }
  .bot { background:var(--card); border:1px solid var(--line); }
  .bot.confirm { background:var(--warnbg); border:2px solid var(--warn); }
  .bot table { border-collapse:collapse; margin:6px 0; font-size:14px; }
  .bot td, .bot th { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
  .bot code { background:#f1f5f9; padding:1px 4px; border-radius:4px; }
  .bot p { margin:6px 0; } .bot ul { margin:6px 0; padding-left:20px; }
  details.tool { margin:6px 0; background:var(--card); border:1px solid var(--line); border-left:4px solid #64748b; border-radius:8px; padding:6px 10px; font-size:13px; max-width:88%; }
  details.tool.ok { border-left-color:var(--brand); } details.tool.err { border-left-color:var(--err); }
  details.tool summary { cursor:pointer; }
  details.tool pre { margin:6px 0 0; overflow:auto; max-height:320px; background:#f1f5f9; padding:8px; border-radius:6px; font-size:12px; }
  .banner { background:var(--warnbg); border:2px solid var(--warn); border-radius:12px; padding:12px 14px; margin:8px 0; }
  .banner strong { color:var(--warn); }
  .banner .acciones { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .thinking { color:var(--muted); font-style:italic; margin:8px 0; }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--card); border-top:1px solid var(--line); }
  form input { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
  button.no { background:#9a3412; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chips button { background:#e7f3ef; color:var(--brand); font-size:13px; padding:6px 10px; }
</style>
</head>
<body>
<header>
  <div><h1>Agente de Órdenes de Compra SAP</h1><small id="estado">Conectando…</small></div>
  <button id="nueva" type="button">Nueva sesión</button>
</header>
<div id="log"><div class="wrap" id="hilo">
  <p class="hint">Pídeme procesar una solicitud. Verás cada llamada a herramienta y, cuando haga falta, una confirmación resaltada.</p>
  <div class="chips">
    <button type="button" data-p="Procesa la solicitud sol-001">sol-001</button>
    <button type="button" data-p="Procesa la solicitud sol-002">sol-002</button>
    <button type="button" data-p="Procesa la solicitud sol-003">sol-003</button>
    <button type="button" data-p='Procesa la solicitud "sol-004". Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.'>sol-004 (demo)</button>
    <button type="button" data-p="Procesa la solicitud sol-005">sol-005</button>
    <button type="button" data-p="Procesa la solicitud sol-006">sol-006</button>
  </div>
</div></div>
<form id="form"><input id="input" autocomplete="off" maxlength="2000" placeholder="Ej.: Procesa la solicitud sol-004 y no la crees hasta que lo confirme"><button id="enviar">Enviar</button></form>
<script src="app.js"></script>
</body>
</html>
